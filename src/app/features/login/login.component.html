<section class="login">
  <div class="login__card">
    <h1>Iniciar sesión</h1>
    <p class="login__sub">Accede a tu panel de atención al cliente</p>

    @if (auth.isLoggedIn()) {
      <!-- Ya autenticado: el navbar también mostrará "Ir a la app" -->
      <div class="login__ok" role="status">
        <p>✓ Sesión iniciada correctamente.</p>
        <button class="btn btn--outline" type="button" (click)="auth.logout()">Cerrar sesión</button>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" formControlName="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        </div>

        @if (error()) {
          <p class="login__error" role="alert">{{ error() }}</p>
        }

        <button class="btn btn--primary btn--block" type="submit" [disabled]="loading()">
          {{ loading() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    }

    <p class="login__signup">
      ¿No tienes cuenta? <a routerLink="/es/crea-una-cuenta-gratuita">Crea una gratis</a>
    </p>
  </div>
</section>
