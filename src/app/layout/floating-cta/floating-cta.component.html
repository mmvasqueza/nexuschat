<div class="fab" [class.fab--open]="open()">
  @if (open()) {
    <div class="fab__panel" role="dialog" aria-label="Opciones de contacto">
      <p class="fab__title">¿Hablamos?</p>
      <p class="fab__text">Nuestro equipo responde en minutos.</p>
      <a class="fab__option" href="https://wa.me/34900000000" target="_blank" rel="noopener">
        <span class="fab__icon fab__icon--wa" aria-hidden="true">✆</span> WhatsApp
      </a>
      <a class="fab__option" routerLink="/es/demo">
        <span class="fab__icon" aria-hidden="true">◔</span> Agendar demo
      </a>
    </div>
  }

  <button class="fab__button" type="button" aria-label="Abrir chat de contacto"
          [attr.aria-expanded]="open()" (click)="toggle()">
    @if (open()) {
      <span aria-hidden="true">✕</span>
    } @else {
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    }
  </button>
</div>
