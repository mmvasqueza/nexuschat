<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Panel de NexusChat">
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1F38"/><stop offset="1" stop-color="#10233F"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDC08A"/><stop offset="1" stop-color="#C9A96E"/>
    </linearGradient>
  </defs>

  <!-- Ventana principal -->
  <rect x="40" y="30" width="680" height="500" rx="20" fill="url(#dashBg)" stroke="#C9A96E" stroke-width="2"/>
  <!-- Barra superior -->
  <rect x="40" y="30" width="680" height="52" rx="20" fill="#060E1C"/>
  <rect x="40" y="62" width="680" height="20" fill="#060E1C"/>
  <circle cx="72" cy="56" r="6" fill="#C9A96E"/><circle cx="92" cy="56" r="6" fill="#DDC08A" opacity=".6"/><circle cx="112" cy="56" r="6" fill="#F7F4EE" opacity=".35"/>

  <!-- Columna: lista de conversaciones -->
  <rect x="40" y="82" width="230" height="448" fill="#060E1C" opacity=".55"/>
  <text x="62" y="116" font-family="Sora,Inter,sans-serif" font-size="15" font-weight="700" fill="#F7F4EE">Conversaciones</text>
  <!-- Items de conversación -->
  <g>
    <rect x="58" y="132" width="194" height="54" rx="12" fill="#16304F"/>
    <circle cx="82" cy="159" r="15" fill="#25D366"/><circle cx="82" cy="159" r="15" fill="none" stroke="#F7F4EE" stroke-width="2"/>
    <rect x="106" y="145" width="96" height="9" rx="4.5" fill="#F7F4EE" opacity=".85"/>
    <rect x="106" y="162" width="126" height="7" rx="3.5" fill="#F7F4EE" opacity=".4"/>
  </g>
  <g opacity=".65">
    <rect x="58" y="196" width="194" height="54" rx="12" fill="#10233F"/>
    <circle cx="82" cy="223" r="15" fill="#E1306C"/>
    <rect x="106" y="209" width="80" height="9" rx="4.5" fill="#F7F4EE" opacity=".85"/>
    <rect x="106" y="226" width="120" height="7" rx="3.5" fill="#F7F4EE" opacity=".4"/>
  </g>
  <g opacity=".45">
    <rect x="58" y="260" width="194" height="54" rx="12" fill="#10233F"/>
    <circle cx="82" cy="287" r="15" fill="#1877F2"/>
    <rect x="106" y="273" width="88" height="9" rx="4.5" fill="#F7F4EE" opacity=".85"/>
    <rect x="106" y="290" width="100" height="7" rx="3.5" fill="#F7F4EE" opacity=".4"/>
  </g>
  <g opacity=".3">
    <rect x="58" y="324" width="194" height="54" rx="12" fill="#10233F"/>
    <circle cx="82" cy="351" r="15" fill="#229ED9"/>
    <rect x="106" y="337" width="70" height="9" rx="4.5" fill="#F7F4EE" opacity=".85"/>
    <rect x="106" y="354" width="130" height="7" rx="3.5" fill="#F7F4EE" opacity=".4"/>
  </g>

  <!-- Zona del chat -->
  <text x="300" y="116" font-family="Sora,Inter,sans-serif" font-size="15" font-weight="700" fill="#F7F4EE">Luna Islay</text>
  <rect x="560" y="98" width="128" height="26" rx="13" fill="none" stroke="#C9A96E" stroke-width="1.5"/>
  <text x="588" y="115" font-family="Inter,sans-serif" font-size="11" fill="#DDC08A">✓ Archivado</text>

  <!-- Burbujas entrantes (cliente) -->
  <rect x="300" y="140" width="330" height="44" rx="14" fill="#1F4068"/>
  <rect x="316" y="152" width="290" height="9" rx="4.5" fill="#F7F4EE" opacity=".85"/>
  <rect x="316" y="168" width="220" height="7" rx="3.5" fill="#F7F4EE" opacity=".45"/>
  <rect x="300" y="196" width="270" height="34" rx="14" fill="#1F4068"/>
  <rect x="316" y="208" width="230" height="9" rx="4.5" fill="#F7F4EE" opacity=".85"/>

  <!-- Burbujas salientes (agente, doradas) -->
  <rect x="430" y="246" width="250" height="40" rx="14" fill="url(#goldBar)"/>
  <rect x="446" y="258" width="210" height="9" rx="4.5" fill="#0A1628" opacity=".8"/>
  <rect x="350" y="300" width="330" height="40" rx="14" fill="url(#goldBar)"/>
  <rect x="366" y="312" width="290" height="9" rx="4.5" fill="#0A1628" opacity=".8"/>

  <!-- Tres puntos de "escribiendo" -->
  <rect x="300" y="356" width="70" height="32" rx="14" fill="#1F4068"/>
  <circle cx="322" cy="372" r="4.5" fill="#DDC08A"/><circle cx="336" cy="372" r="4.5" fill="#DDC08A" opacity=".7"/><circle cx="350" cy="372" r="4.5" fill="#DDC08A" opacity=".45"/>

  <!-- Caja de entrada -->
  <rect x="300" y="412" width="380" height="48" rx="14" fill="#060E1C" stroke="#1F4068"/>
  <rect x="320" y="430" width="180" height="9" rx="4.5" fill="#F7F4EE" opacity=".35"/>
  <rect x="612" y="412" width="68" height="48" rx="14" fill="url(#goldBar)"/>
  <path d="M646 428 664 436l-18 8v-7l12-1-12-1Z" fill="#0A1628"/>

  <!-- Métricas inferiores -->
  <rect x="300" y="480" width="380" height="50" rx="14" fill="#060E1C" stroke="#1F4068"/>
  <text x="322" y="511" font-family="Inter,sans-serif" font-size="12" fill="#DDC08A">↑ 98% CSAT</text>
  <text x="440" y="511" font-family="Inter,sans-serif" font-size="12" fill="#F7F4EE" opacity=".6">⏱ 1m 42s respuesta</text>
  <text x="590" y="511" font-family="Inter,sans-serif" font-size="12" fill="#F7F4EE" opacity=".6">349 chats</text>

  <!-- Burbujas flotantes decorativas -->
  <g>
    <rect x="560" y="470" width="150" height="46" rx="14" fill="#FFFFFF"/>
    <circle cx="583" cy="493" r="13" fill="#25D366"/>
    <rect x="604" y="482" width="88" height="8" rx="4" fill="#10233F"/>
    <rect x="604" y="496" width="60" height="6" rx="3" fill="#E3DAC9"/>
  </g>
  <g transform="rotate(-6 110 520)">
    <rect x="70" y="500" width="150" height="46" rx="14" fill="#FFFFFF"/>
    <circle cx="93" cy="523" r="13" fill="#E1306C"/>
    <rect x="114" y="512" width="88" height="8" rx="4" fill="#10233F"/>
    <rect x="114" y="526" width="70" height="6" rx="3" fill="#E3DAC9"/>
  </g>
</svg>
