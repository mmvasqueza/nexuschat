<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="Enrutamiento por departamentos">
  <rect width="520" height="420" rx="22" fill="#F7F4EE"/>
  <circle cx="440" cy="60" r="110" fill="#C9A96E" opacity=".14"/>
  <!-- Entrada: mensaje -->
  <rect x="36" y="176" width="110" height="68" rx="16" fill="#0A1628"/>
  <text x="56" y="204" font-family="Inter,sans-serif" font-size="11" fill="#DDC08A">mensaje entrante</text>
  <rect x="54" y="214" width="74" height="8" rx="4" fill="#F7F4EE" opacity=".6"/>
  <!-- Nodo router -->
  <circle cx="260" cy="210" r="44" fill="#060E1C" stroke="#C9A96E" stroke-width="2.4"/>
  <path d="M260 182v24l16 10" stroke="#DDC08A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Rutas a departamentos -->
  <g stroke="#1F4068" stroke-width="2.2" fill="none">
    <path d="M304 190 C 360 150, 380 120, 396 106"/>
    <path d="M304 210 H 396"/>
    <path d="M304 230 C 360 270, 380 300, 396 314"/>
  </g>
  <g fill="#C9A96E">
    <circle cx="352" cy="144" r="4"/><circle cx="352" cy="210" r="4"/><circle cx="352" cy="276" r="4"/>
  </g>
  <!-- Departamentos -->
  <g>
    <rect x="396" y="76" width="108" height="56" rx="14" fill="#fff" stroke="#C9A96E" stroke-width="1.8"/>
    <text x="414" y="101" font-family="Sora,sans-serif" font-size="12" font-weight="700" fill="#0A1628">Ventas</text>
    <rect x="412" y="110" width="66" height="7" rx="3.5" fill="#E3DAC9"/>
    <rect x="396" y="182" width="108" height="56" rx="14" fill="#fff" stroke="#C9A96E" stroke-width="1.8"/>
    <text x="414" y="207" font-family="Sora,sans-serif" font-size="12" font-weight="700" fill="#0A1628">Soporte</text>
    <rect x="412" y="216" width="66" height="7" rx="3.5" fill="#E3DAC9"/>
    <rect x="396" y="288" width="108" height="56" rx="14" fill="#fff" stroke="#C9A96E" stroke-width="1.8"/>
    <text x="414" y="313" font-family="Sora,sans-serif" font-size="12" font-weight="700" fill="#0A1628">Facturación</text>
    <rect x="412" y="322" width="66" height="7" rx="3.5" fill="#E3DAC9"/>
  </g>
  <!-- Regla -->
  <text x="56" y="330" font-family="Inter,sans-serif" font-size="12" fill="#16304F">if intención = "comprar" → Ventas</text>
  <text x="56" y="352" font-family="Inter,sans-serif" font-size="12" fill="#16304F">if palabra clave = "factura" → Facturación</text>
</svg>
